services:
  soulmask:
    container_name: soulmask-server
    hostname: soulmask-server
    image: ghcr.io/studyfranco/soulmask-docker:master
    #network_mode: "host"
    volumes:
      - "/path/to/config:/config"
    ports:
      - 8777:8777/udp
      - 27015:27015/udp
      #- 27017:27017/udp
    expose:
      - 8211/udp
      - 27015/udp
      #- 27017/udp
    environment:
      - "SERVER_NAME=SoulmaskServerByMe"
      - "SERVER_PORT=8777"
      - "SERVER_QUERY_PORT=27015"
      #- "RCON_PORT=25575"
      #- "RCON_PASSWORD=password"
      - "MAXPLAYERS=32"
      - "SERVERPASSWORD=password"
      - "SERVERADMINPASSWORD=password"
      - "PUID=2198"
      - "PGID=2198"
      - "BACKUP=900"
      - "SAVING=600"
      - "GAME_MODE=pve"
      - "SERVER_LEVEL=Level01_Main"
      - "MOD_ID_LIST="
      - "TZ=Etc/UTC"
    tmpfs:
      - "/run:exec,mode=777"
      - "/tmp:exec,mode=777"
      - "/tmp/dumps:exec,mode=777"
      - "/var/tmp:exec,mode=777"
      - "/config/gamefiles/steamapps/temp:uid=2198,gid=2198"
    restart: "unless-stopped"
    stop_grace_period: 1m
